name: NEXUS checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/data-integration-foundation

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Dependency audit summary
        run: |
          npm audit --json > audit.json || true
          node -e "const a=require('./audit.json'); console.log('Vulnerabilities:', a.metadata?.vulnerabilities); for (const [name, v] of Object.entries(a.vulnerabilities || {})) console.log(name, v.severity, 'range=' + v.range, 'fix=' + JSON.stringify(v.fixAvailable));"
      - name: Build frontend
        run: npm run build
      - name: Typecheck backend
        run: npm run typecheck:server
      - name: Build backend
        run: npm run build:server
      - name: Test backend utilities
        run: npm run test:server
